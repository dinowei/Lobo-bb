# Mantém o site do Render (plano free, dorme após 15 min sem acesso) acordado nos horários de estudo.
# Horários de Brasília (UTC−3): 11:30–13:30 e 18:30–23:30. O cron do GitHub é em UTC.
# 44 execuções por dia × 1 min cobrado = ~1.320 min/mês (meta < 1.500). Sem segredos: só um GET público.
name: Acordar o site

on:
  schedule:
    # 11:30–13:30 BRT = 14:30–16:30 UTC
    - cron: "30,40,50 14 * * *"
    - cron: "*/10 15 * * *"
    - cron: "0,10,20,30 16 * * *"
    # 18:30–23:30 BRT = 21:30–02:30 UTC (passa da meia-noite UTC)
    - cron: "30,40,50 21 * * *"
    - cron: "*/10 22,23,0,1 * * *"
    - cron: "0,10,20,30 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/saude
        # acordar leva ~1 min; site fora não deve virar e-mail de falha a cada 10 min
        run: |
          if curl -fsS --max-time 100 --retry 1 --retry-delay 10 -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" https://lobo-binho.onrender.com/api/saude; then
            echo "acordado"
          else
            echo "::warning::o site não respondeu a tempo"
          fi
